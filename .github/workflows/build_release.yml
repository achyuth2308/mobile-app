name: Build Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Sign Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/fueltracks-upload.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../fueltracks-upload.jks
EOF

      - name: Build Release AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fueltracks-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Show build info
        run: |
          echo "Build complete!"
          ls -lh build/app/outputs/bundle/release/
