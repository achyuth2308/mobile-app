<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3D Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.7/dist/threebox.min.js" type="text/javascript"></script>
    <link href="https://cdn.jsdelivr.net/gh/jscastro76/threebox@v.2.2.7/dist/threebox.css" rel="stylesheet" type="text/css" />
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty', 
        center: [0, 0],
        zoom: 16,
        pitch: 60,
        bearing: 0,
        antialias: true
    });

    let tb;
    let vehicleModels = {};
    let isMapLoaded = false;
    let queuedMessages = [];

    map.on('style.load', () => {
        map.addLayer({
            id: 'custom-threebox-model',
            type: 'custom',
            renderingMode: '3d',
            onAdd: function (map, mbxContext) {
                tb = new Threebox(
                    map,
                    mbxContext,
                    { defaultLights: true }
                );
                isMapLoaded = true;
                processQueuedMessages();
            },
            render: function (gl, matrix) {
                if (tb) {
                    tb.update();
                }
            }
        });
    });

    function processQueuedMessages() {
        if (!isMapLoaded) return;
        queuedMessages.forEach(processMessage);
        queuedMessages = [];
    }

    function processMessage(message) {
        if (message.type === 'updateVehicles') {
            const vehicles = message.vehicles;
            vehicles.forEach(vehicle => {
                // Determine model file and scale based on type
                const isBike = vehicle.type === 'bike' || vehicle.type === 'scooter';
                const modelFile = isBike ? 'vespa.glb' : 'classic_muscle_car.glb';
                const scale = isBike ? 2.5 : 5; // Vespa might need different scaling
                const rotation = { x: 90, y: vehicle.heading || 0, z: 0 };

                if (vehicleModels[vehicle.id] && vehicleModels[vehicle.id] !== 'loading') {
                    const model = vehicleModels[vehicle.id];
                    model.setCoords([vehicle.lng, vehicle.lat]);
                    model.setRotation(rotation); 
                } else if (!vehicleModels[vehicle.id]) {
                    vehicleModels[vehicle.id] = 'loading'; 
                    const options = {
                        obj: modelFile,
                        type: 'gltf',
                        scale: scale,
                        units: 'meters',
                        rotation: rotation
                    };
                    tb.loadObj(options, function (model) {
                        model.setCoords([vehicle.lng, vehicle.lat]);
                        tb.add(model);
                        vehicleModels[vehicle.id] = model;
                    });
                }
            });
        } else if (message.type === 'centerMap') {
            map.flyTo({ center: [message.lng, message.lat], zoom: 16, essential: true });
        }
    }

    window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;
        try {
            const message = typeof data === 'string' ? JSON.parse(data) : data;
            if (!isMapLoaded) {
                queuedMessages.push(message);
            } else {
                processMessage(message);
            }
        } catch (e) {
            console.error('Error processing message:', e);
        }
    });
</script>
</body>
</html>
