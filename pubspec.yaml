name: fueltracks
description: FuelTracks — production customer fleet monitoring app (Material 3).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.3

  # ── Real-time ─────────────────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Maps (OpenStreetMap / Leaflet-equivalent) ─────────────────────
  # flutter_map is the Flutter port of Leaflet. No API key, no billing
  # account, no per-load quota — and markers are real Flutter widgets,
  # so status colour/heading come straight from the design system.
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  # NOTE: no geolocator. Vehicle positions come from GPS trackers via the
  # API, so the app never needs the phone's own location. Dropping it also
  # removes a runtime location permission we would have to justify.

  # ── Firebase / Push ───────────────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # ── Storage & security ────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # ── Routing ───────────────────────────────────────────────────────
  go_router: ^14.1.4

  # ── Permissions & device ──────────────────────────────────────────
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  url_launcher: ^6.3.0

  # ── UI / UX ───────────────────────────────────────────────────────
  # NOTE: fonts are bundled as assets (see `fonts:` below), NOT fetched from
  # the Google Fonts CDN at runtime. That removes a first-launch network
  # round-trip, a flash of fallback type, and a privacy-review question.
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.5.0
  syncfusion_flutter_datepicker: 34.2.2
  dotted_border: ^2.1.0

  # ── Utils ─────────────────────────────────────────────────────────
  intl: ^0.20.2
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  csv: ^6.0.0
  google_fonts: ^8.2.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  image: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    # Fonts are declared below. `map_styles/` is gone: OSM tile styles are
    # defined in Dart (lib/features/live_map/widgets/map_tiles.dart), not
    # as JSON assets the way Google Maps required.
    - assets/images/
    - assets/images/vehicles/

  fonts:
    # Variable fonts: one file covers the whole weight axis.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

flutter_native_splash:
  color: "#0B1020"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0B1020"
    image: assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_master.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
