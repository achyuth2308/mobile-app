# Tuned for a memory-constrained build host (~2 GB RAM).
# The Flutter default (-Xmx4G) OOM-kills the daemon here.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1

android.useAndroidX=true
android.enableJetifier=true
# Keep R8/dex from spawning its own large JVM.
android.enableR8.fullMode=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
